openapi: 3.0.3
info:
  title: Quantum Aether — Post-Quantum TLS Readiness Scanner
  description: >
    Free API that checks whether an HTTPS server negotiates the hybrid post-quantum key exchange
    X25519MLKEM768 (ML-KEM, FIPS 203), and summarizes its TLS version and certificate.
    The full report (remediation steps, certificate details) is sold separately through a
    PayPal checkout on the scan page; payment is approved by a person in the PayPal window.
  version: 2.0.0
servers:
  - url: "{{PUBLIC_URL}}"
paths:
  /api/scan:
    post:
      operationId: scanPublicTls
      summary: Scan a public domain (free, rate limited per client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        "201":
          description: Scan completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "400":
          description: The domain could not be scanned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many scans from this client in the last hour.
  /api/v1/quantum-scan:
    post:
      summary: Agent endpoint — real domain scan, or an honest assessment of an RSA key size
      description: >
        With `domain`, runs the same real scan as POST /api/scan (rate limited).
        With only `key_size`, returns what that key size means against classical and quantum attackers;
        no network scan is made. Shor's algorithm breaks RSA and ECC of any size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  example: example.com
                key_size:
                  type: integer
                  default: 2048
                  minimum: 512
                  maximum: 16384
      responses:
        "200":
          description: Key-size assessment (request had only key_size).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeySizeAssessment" }
        "201":
          description: Domain scanned (request had domain).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "400":
          description: Invalid domain or key size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many scans from this client in the last hour.
  /api/v1/orders:
    post:
      summary: Buy the full report for a scan — returns a PayPal approval link
      description: >
        Creates a PayPal order for the scan's full report. Open approve_url (the payer, or an agent the
        payer authorized in PayPal, approves it). PayPal then returns to this site, which captures and
        verifies the payment automatically; afterwards GET status_url returns report_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_id, consent_immediate_delivery]
              properties:
                scan_id: { type: string }
                consent_immediate_delivery:
                  type: boolean
                  enum: [true]
                  description: >
                    Must be true, and only after the payer has expressly agreed that the report is delivered
                    immediately after payment and acknowledged losing the statutory right of withdrawal
                    (Austrian FAGG § 18(1)(11)).
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: consent_immediate_delivery missing or not true. }
        "404": { description: Unknown scan. }
        "409": { description: The report for this scan is already paid. }
        "503": { description: Payments are not configured. }
  /api/v1/orders/{order_id}:
    get:
      summary: Order status; includes report_url once the payment is captured
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatus" }
        "404": { description: Unknown order. }
  /api/v1/crypto/orders:
    post:
      summary: Buy the full report with a stablecoin (USDT on Polygon or USDC on Arbitrum One)
      description: >
        Returns a unique amount (for example 49.0137) and a receiving address. Send exactly that amount of the
        token on that network (a direct ERC-20 transfer), then POST the transaction hash to verify_url. The server
        reads the transaction receipt from the blockchain itself and unlocks the report once the transfer to our
        address has enough confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_id, network, consent_immediate_delivery]
              properties:
                scan_id: { type: string }
                network: { type: string, enum: [polygon-usdt, arbitrum-usdc] }
                consent_immediate_delivery:
                  type: boolean
                  enum: [true]
                  description: Same meaning as for /api/v1/orders (Austrian FAGG § 18(1)(11)).
      responses:
        "201":
          description: Payment request created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string }
                  network: { type: string }
                  chain: { type: string }
                  chain_id: { type: integer }
                  token: { type: string }
                  token_contract: { type: string }
                  pay_to: { type: string }
                  amount: { type: string, description: Exact amount to send, in token units. }
                  confirmations_required: { type: integer }
                  verify_url: { type: string }
                  status_url: { type: string }
        "400": { description: Consent missing or unknown network (the response lists available networks). }
        "404": { description: Unknown scan. }
        "409": { description: The report for this scan is already paid. }
        "503": { description: Stablecoin payments are not configured. }
  /api/v1/agent/report/{scan_id}:
    post:
      summary: Retrieve a full report using x402 v2 payment in USDC on Base
      description: Returns HTTP 402 and a PAYMENT-REQUIRED challenge when unpaid. Retry with the x402 PAYMENT-SIGNATURE header. The server verifies and settles the exact payment through the configured facilitator before returning the report. USDC on Base, exact amount based on current report price.
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment settled; includes report_url and PAYMENT-RESPONSE. }
        "202": { description: Settlement pending or reconciliation required; retry/reconcile the same payment. }
        "402": { description: Payment required or payment invalid; see PAYMENT-REQUIRED header. }
        "404": { description: Unknown scan. }
        "409": { description: Report already paid. }
        "503": { description: Base USDC receiver not configured or facilitator unavailable. }
  /api/v1/crypto/orders/{order_id}/verify:
    post:
      summary: Submit the transaction hash; returns report_url once the payment is confirmed on-chain
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash]
              properties:
                tx_hash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200": { description: "Paid: {status: COMPLETED, report_url}." }
        "202": { description: "Not final yet: status PENDING (not mined) or CONFIRMING (with confirmations). Retry later." }
        "400": { description: Malformed transaction hash. }
        "402": { description: "Rejected: error is wrong_amount, no_transfer, too_old or failed." }
        "404": { description: Unknown order. }
        "409": { description: Transaction already used for another order. }
        "502": { description: Blockchain temporarily unreachable; retry. }
  /badge/{domain}.svg:
    get:
      summary: Embeddable SVG badge with the domain's latest grade (scans from the last 30 days; never triggers a scan)
      operationId: getBadge
      parameters:
        - name: domain
          in: path
          required: true
          schema: {type: string, example: example.com}
      responses:
        "200":
          description: SVG badge (grey "not scanned" if there is no recent scan)
          content:
            image/svg+xml: {}
  /api/scan/{scan_id}:
    get:
      summary: Fetch the summary of an earlier scan
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "404":
          description: Unknown scan.
  /api/v1/badge/{domain}:
    get:
      summary: Verify stored TLS badge evidence without initiating a scan
      description: Returns fresh, stale, undetermined or not_scanned, with measurement and expiration timestamps. Does not prove ownership or comprehensive security.
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored evidence only; Cache-Control never extends past the evidence expiration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  state: { type: string, enum: [fresh, stale, undetermined, not_scanned] }
                  grade: { type: string, nullable: true }
                  checked_at: { type: string, nullable: true }
                  expires_at: { type: string, nullable: true }
                  verification_url: { type: string, format: uri }
                  limitations: { type: string }
        "400":
          description: Invalid domain.
  /.well-known/agent-service.json:
    get:
      operationId: discoverQuantumAether
      summary: Discover implemented agent tools, pricing, limits and payment status
      responses:
        "200":
          description: Custom service discovery metadata; not an A2A Agent Card.
          content:
            application/json:
              schema: { type: object }
  /api/v1/agent/methodology:
    get:
      operationId: getTlsMethodology
      summary: Read measurement scope, observation states and limitations without scanning
      responses:
        "200":
          description: Measurement methodology, privacy limitations and interpretation rules.
          content:
            application/json:
              schema: { type: object }
  /api/v1/agent/example:
    get:
      operationId: getArchivedTlsExample
      summary: Read an explicitly labeled archived example without scanning
      responses:
        "200":
          description: Historical sample, is_example true and is_live false.
          content:
            application/json:
              schema: { type: object }
  /mcp:
    post:
      operationId: callQuantumAetherMcp
      summary: Stateless remote MCP over Streamable HTTP with JSON responses
      description: >
        Supports initialize, ping, tools/list and tools/call. Use the MCP client protocol;
        scan_tls starts a public, rate-limited probe and stores a public result.
        Read-only tools never start scans. GET returns 405 because no SSE stream is provided.
        No automatic payments or signed receipts are implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                method: { type: string }
                id:
                  oneOf:
                    - { type: string }
                    - { type: number }
                params: { type: object }
      responses:
        "200":
          description: JSON-RPC result, protocol error, or MCP tool error.
          content:
            application/json:
              schema: { type: object }
        "202":
          description: Notification accepted with no response body.
        "400":
          description: Invalid JSON-RPC request or unsupported protocol version.
        "403":
          description: Origin is not the configured service origin.
        "404":
          description: Unknown JSON-RPC method.
        "415":
          description: Content-Type must be application/json.
components:
  schemas:
    ScanSummary:
      type: object
      properties:
        scan_id: { type: string }
        domain: { type: string }
        grade:
          type: string
          enum: [A, B, C, F]
          description: A = TLS 1.3 with post-quantum hybrid key exchange; B = TLS 1.3 classical; C = no TLS 1.3; F = critical issue.
        scanned_at: { type: string, format: date-time }
        tls_version: { type: string, example: TLSv1.3 }
        key_exchange_group: { type: string, example: X25519MLKEM768 }
        post_quantum_key_exchange:
          type: boolean
          description: True only when PQ exchange was observed. False may mean classical or undetermined; inspect observation_status.
        observation_status:
          type: string
          enum: [observed_pq, observed_classical, undetermined]
        port: { type: integer, enum: [443] }
        limitations: { type: string }
        certificate_key: { type: string, example: ECDSA-256 }
        certificate_valid: { type: boolean }
        findings_in_full_report: { type: integer }
        scan_url: { type: string, format: uri }
        full_report_price:
          type: object
          properties:
            amount: { type: string, example: "49.00" }
            currency: { type: string, example: USD }
    Order:
      type: object
      properties:
        order_id: { type: string }
        approve_url: { type: string, format: uri }
        status_url: { type: string, format: uri }
        amount: { type: string, example: "49.00" }
        currency: { type: string, example: USD }
    OrderStatus:
      type: object
      properties:
        order_id: { type: string }
        status: { type: string, enum: [CREATED, PENDING, COMPLETED, FAILED] }
        amount: { type: string }
        currency: { type: string }
        report_url: { type: string, format: uri, description: Present when status is COMPLETED. }
    KeySizeAssessment:
      type: object
      properties:
        key_size_bits: { type: integer }
        algorithm: { type: string, example: RSA }
        classical_security: { type: string, enum: [weak, acceptable] }
        quantum_vulnerable: { type: boolean }
        quantum_note: { type: string }
        published_estimate: { type: string }
        recommended_action: { type: string }
        scan_your_domain: { type: object }
        full_report: { type: object }
    Error:
      type: object
      properties:
        error:
          type: string
          enum: [invalid_domain, private_address, dns_failure, connect_failure, tls_failure, invalid_key_size]
        message: { type: string }
