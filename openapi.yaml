openapi: 3.0.3
info:
  title: Quantum Aether — Post-Quantum TLS Readiness Scanner
  description: >
    Free API that checks whether an HTTPS server negotiates the hybrid post-quantum key exchange
    X25519MLKEM768 (ML-KEM, FIPS 203), summarizes its TLS version and certificate, and issues
    offline-verifiable Ed25519 JWS signed TLS receipts (v1, policy qa-pqc-transport 1.0, JWKS at
    /.well-known/jwks.json). Full remediation reports are available via PayPal, direct stablecoin,
    or x402 v2 USDC on Base. AI agents and operators can also self-register in the AI Agent
    Affiliate Programme via POST /api/v1/agent/affiliate/register or MCP register_agent_affiliate
    for an instant ?ref=CODE link (30% of monitoring for 12 months, 20% of one-time reports/audits,
    paid monthly manually by the owner via PayPal or USDC after a 30-day hold, min $50).
  version: 2.1.0
servers:
  - url: "{{PUBLIC_URL}}"
paths:
  /api/scan:
    post:
      operationId: scanPublicTls
      summary: Scan a public domain (free, rate limited per client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        "201":
          description: Scan completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "400":
          description: The domain could not be scanned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many scans from this client in the last hour.
  /api/v1/quantum-scan:
    post:
      summary: Agent endpoint — real domain scan, or an honest assessment of an RSA key size
      description: >
        With `domain`, runs the same real scan as POST /api/scan (rate limited).
        With only `key_size`, returns what that key size means against classical and quantum attackers;
        no network scan is made. Shor's algorithm breaks RSA and ECC of any size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  example: example.com
                key_size:
                  type: integer
                  default: 2048
                  minimum: 512
                  maximum: 16384
      responses:
        "200":
          description: Key-size assessment (request had only key_size).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeySizeAssessment" }
        "201":
          description: Domain scanned (request had domain).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "400":
          description: Invalid domain or key size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many scans from this client in the last hour.
  /api/v1/orders:
    post:
      summary: Buy the full report for a scan — returns a PayPal approval link
      description: >
        Creates a PayPal order for the scan's full report. Open approve_url (the payer, or an agent the
        payer authorized in PayPal, approves it). PayPal then returns to this site, which captures and
        verifies the payment automatically; afterwards GET status_url returns report_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_id, consent_immediate_delivery]
              properties:
                scan_id: { type: string }
                consent_immediate_delivery:
                  type: boolean
                  enum: [true]
                  description: >
                    Must be true, and only after the payer has expressly agreed that the report is delivered
                    immediately after payment and acknowledged losing the statutory right of withdrawal
                    (Austrian FAGG § 18(1)(11)).
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: consent_immediate_delivery missing or not true. }
        "404": { description: Unknown scan. }
        "409": { description: The report for this scan is already paid. }
        "503": { description: Payments are not configured. }
  /api/v1/orders/{order_id}:
    get:
      summary: Order status; includes report_url once the payment is captured
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatus" }
        "404": { description: Unknown order. }
  /api/v1/crypto/orders:
    post:
      summary: Buy the full report with a stablecoin (USDT on Polygon, USDC on Arbitrum or Base)
      description: >
        Returns a unique amount (for example 49.0137) and a receiving address. Send exactly that amount of the
        token on that network (a direct ERC-20 transfer), then POST the transaction hash to verify_url. The server
        reads the transaction receipt from the blockchain itself and unlocks the report once the transfer to our
        address has enough confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_id, network, consent_immediate_delivery]
              properties:
                scan_id: { type: string }
                network: { type: string, enum: [polygon-usdt, arbitrum-usdc, base-usdc] }
                consent_immediate_delivery:
                  type: boolean
                  enum: [true]
                  description: Same meaning as for /api/v1/orders (Austrian FAGG § 18(1)(11)).
      responses:
        "201":
          description: Payment request created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string }
                  network: { type: string }
                  chain: { type: string }
                  chain_id: { type: integer }
                  token: { type: string }
                  token_contract: { type: string }
                  pay_to: { type: string }
                  amount: { type: string, description: Exact amount to send, in token units. }
                  confirmations_required: { type: integer }
                  verify_url: { type: string }
                  status_url: { type: string }
        "400": { description: Consent missing or unknown network (the response lists available networks). }
        "404": { description: Unknown scan. }
        "409": { description: The report for this scan is already paid. }
        "503": { description: Stablecoin payments are not configured. }
  /api/v1/agent/report/{scan_id}:
    post:
      summary: Retrieve a full report using x402 v2 payment in USDC on Base
      description: Returns HTTP 402 and a PAYMENT-REQUIRED challenge when unpaid. Retry with the x402 PAYMENT-SIGNATURE header. The server verifies and settles the exact payment through the configured facilitator before returning the report. USDC on Base, exact amount based on current report price.
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment settled; includes report_url and PAYMENT-RESPONSE. }
        "202": { description: Settlement pending or reconciliation required; retry/reconcile the same payment. }
        "402": { description: Payment required or payment invalid; see PAYMENT-REQUIRED header. }
        "404": { description: Unknown scan. }
        "409": { description: Report already paid. }
        "503": { description: Base USDC receiver not configured or facilitator unavailable. }
  /api/v1/crypto/orders/{order_id}/verify:
    post:
      summary: Submit the transaction hash; returns report_url once the payment is confirmed on-chain
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash]
              properties:
                tx_hash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200": { description: "Paid: {status: COMPLETED, report_url}." }
        "202": { description: "Not final yet: status PENDING (not mined) or CONFIRMING (with confirmations). Retry later." }
        "400": { description: Malformed transaction hash. }
        "402": { description: "Rejected: error is wrong_amount, no_transfer, too_old or failed." }
        "404": { description: Unknown order. }
        "409": { description: Transaction already used for another order. }
        "502": { description: Blockchain temporarily unreachable; retry. }
  /badge/{domain}.svg:
    get:
      summary: Embeddable SVG badge with the domain's latest grade (scans from the last 30 days; never triggers a scan)
      operationId: getBadge
      parameters:
        - name: domain
          in: path
          required: true
          schema: {type: string, example: example.com}
      responses:
        "200":
          description: SVG badge (grey "not scanned" if there is no recent scan)
          content:
            image/svg+xml: {}
  /api/scan/{scan_id}:
    get:
      summary: Fetch the summary of an earlier scan
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scan summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSummary" }
        "404":
          description: Unknown scan.
  /api/v1/adoption/stats:
    get:
      operationId: getAdoptionStats
      summary: Public post-quantum TLS adoption summary (free, CC BY 4.0, never scans)
      description: >
        Top-1,000 and top-10,000 share of sites that negotiate X25519MLKEM768, per-sector watchlists,
        per-country board (ccTLD) and links to every open dataset. Weekly data.
      responses:
        "200":
          description: Adoption summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  week: { type: string, example: 2026-W48 }
                  top1000: { type: object, nullable: true }
                  top10k: { type: object, nullable: true }
                  sectors: { type: array, items: { type: object } }
                  countries: { type: array, items: { type: object } }
                  datasets: { type: object }
                  license: { type: string, example: CC BY 4.0 }
  /api/v1/badge/{domain}:
    get:
      summary: Verify stored TLS badge evidence without initiating a scan
      description: Returns fresh, stale, undetermined or not_scanned, with measurement and expiration timestamps. Does not prove ownership or comprehensive security.
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored evidence only; Cache-Control never extends past the evidence expiration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  state: { type: string, enum: [fresh, stale, undetermined, not_scanned] }
                  grade: { type: string, nullable: true }
                  checked_at: { type: string, nullable: true }
                  expires_at: { type: string, nullable: true }
                  verification_url: { type: string, format: uri }
                  limitations: { type: string }
        "400":
          description: Invalid domain.
  /.well-known/agent-service.json:
    get:
      operationId: discoverQuantumAether
      summary: Discover implemented agent tools, pricing, limits and payment status
      responses:
        "200":
          description: Custom service discovery metadata; not an A2A Agent Card.
          content:
            application/json:
              schema: { type: object }
  /api/v1/agent/methodology:
    get:
      operationId: getTlsMethodology
      summary: Read measurement scope, observation states and limitations without scanning
      responses:
        "200":
          description: Measurement methodology, privacy limitations and interpretation rules.
          content:
            application/json:
              schema: { type: object }
  /api/v1/agent/example:
    get:
      operationId: getArchivedTlsExample
      summary: Read an explicitly labeled archived example without scanning
      responses:
        "200":
          description: Historical sample, is_example true and is_live false.
          content:
            application/json:
              schema: { type: object }
  /mcp:
    post:
      operationId: callQuantumAetherMcp
      summary: Stateless remote MCP over Streamable HTTP with JSON responses
      description: >
        Supports initialize, ping, tools/list and tools/call. Use the MCP client protocol;
        scan_tls starts a public, rate-limited probe, stores a public result, and issues an
        offline-verifiable Ed25519 JWS signed TLS receipt (v1, JWKS at /.well-known/jwks.json).
        Read-only tools never start scans. Paid tools support x402 v2 exact USDC on Base.
        AI agents can self-register for the 30% recurring affiliate programme via register_agent_affiliate.
        GET returns 405 because no SSE stream is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ["2.0"] }
                method: { type: string }
                id:
                  oneOf:
                    - { type: string }
                    - { type: number }
                params: { type: object }
      responses:
        "200":
          description: JSON-RPC result, protocol error, or MCP tool error.
          content:
            application/json:
              schema: { type: object }
        "202":
          description: Notification accepted with no response body.
        "400":
          description: Invalid JSON-RPC request or unsupported protocol version.
        "403":
          description: Origin is not the configured service origin.
        "404":
          description: Unknown JSON-RPC method.
        "415":
          description: Content-Type must be application/json.
  /api/v1/scan:
    post:
      operationId: scanTlsSignedReceipt
      summary: Scan a public TLS endpoint and issue an Ed25519 JWS signed TLS receipt (v1)
      description: >
        Runs a rate-limited public TLS probe for host:port (default 443), evaluates policy
        qa-pqc-transport 1.0, persists the receipt, and returns dual format: structured receipt
        claims, compact RFC 7515 Ed25519 JWS (signed_receipt_jws), and verification pointers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, example: mcp.example.com }
                port: { type: integer, default: 443, minimum: 1, maximum: 65535 }
                endpoint_type: { type: string, example: mcp_remote }
                discovered_manifest: { type: string, example: /.well-known/mcp/server-card.json }
      responses:
        "200":
          description: Scan completed and v1 signed receipt issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedReceiptResponse" }
        "400":
          description: Invalid host, port, or private address.
        "429":
          description: Rate limit exceeded.
  /api/v1/receipts/{jti}:
    get:
      operationId: getSignedReceipt
      summary: Fetch a stored v1 signed TLS receipt by jti without starting a scan
      parameters:
        - name: jti
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored signed receipt in dual format (receipt + signed_receipt_jws + verify).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedReceiptResponse" }
        "404":
          description: Unknown receipt ID.
  /api/v1/attestation:
    get:
      operationId: getTlsAttestation
      summary: Paid portable signed PQ-TLS attestation bundle for one domain (x402, USDC on Base)
      description: >
        Returns HTTP 402 with a PAYMENT-REQUIRED x402 v2 challenge when unpaid; retry with the
        x402 PAYMENT-SIGNATURE header. Once settled, returns a portable, offline-verifiable evidence
        bundle: a fresh Ed25519 JWS signed observation of the domain's public TLS endpoint (hybrid
        post-quantum key exchange) plus verification pointers and explicit scope. Measurement limits:
        one vantage, one public IPv4 endpoint, port 443; may not represent an origin behind a CDN.
        A measurement evidence bundle (e.g. NIS2/DORA transport), not a legal compliance certification.
        The basic scan and its signed receipt are free (POST /api/v1/scan). Calling without a signed
        payment never charges. Also available as the MCP tool get_tls_attestation. Price 5.00 USDC.
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string, example: example.com }
      responses:
        "200": { description: Payment settled; signed attestation bundle with PAYMENT-RESPONSE header. }
        "400": { description: Invalid domain. }
        "402": { description: Payment required or payment invalid; see PAYMENT-REQUIRED header. }
        "429": { description: Rate limit exceeded. }
        "503": { description: Base USDC receiver not configured or facilitator unavailable. }
  /api/v1/agent/affiliate/register:
    post:
      operationId: registerAgentAffiliate
      summary: Programmatically register an AI agent or operator in the affiliate programme
      description: >
        Immediately issues an active ?ref=CODE referral link (idempotent per contact_email).
        Earns 30% of monitoring payments for 12 months and 20% of one-time reports, agency packs,
        and audits. Paid monthly manually by the owner (PayPal or USDC on Base/Arbitrum) after a
        30-day refund hold, from $50 minimum. No automatic payouts; no spam or unsolicited cold emails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAffiliateRequest" }
      responses:
        "201":
          description: New partner code created and active immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAffiliateRegistration" }
        "200":
          description: Existing active partner code returned for the same contact_email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAffiliateRegistration" }
        "400":
          description: Invalid fields or consent_terms missing/false.
        "429":
          description: Registration rate limit exceeded.
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Public Ed25519 JWKS (application/jwk-set+json) for offline receipt verification
      responses:
        "200":
          description: JWK Set containing active verification keys.
  /.well-known/qa-receipt-configuration:
    get:
      operationId: getReceiptConfiguration
      summary: Signed TLS receipt issuer metadata, JWKS URI, and policy URI
      responses:
        "200":
          description: Receipt issuer configuration document.
  /.well-known/mcp/server-card.json:
    get:
      operationId: getMcpServerCard
      summary: Machine-readable MCP Server Card with transport, tools, signed receipts and affiliate metadata
      responses:
        "200":
          description: MCP Server Card JSON.
  /.well-known/api-catalog:
    get:
      operationId: getApiCatalog
      summary: RFC 9727 API Catalog (application/linkset+json) linking all machine-readable specifications
      responses:
        "200":
          description: Linkset JSON document.
  /.well-known/agents.json:
    get:
      operationId: getAgentsJson
      summary: WildCard agents.json declarative workflow specification for LLM agents
      responses:
        "200":
          description: agents.json document.
components:
  schemas:
    ScanSummary:
      type: object
      properties:
        scan_id: { type: string }
        domain: { type: string }
        grade:
          type: string
          enum: [A, B, C, F]
          description: A = TLS 1.3 with post-quantum hybrid key exchange; B = TLS 1.3 classical; C = no TLS 1.3; F = critical issue.
        scanned_at: { type: string, format: date-time }
        tls_version: { type: string, example: TLSv1.3 }
        key_exchange_group: { type: string, example: X25519MLKEM768 }
        post_quantum_key_exchange:
          type: boolean
          description: True only when PQ exchange was observed. False may mean classical or undetermined; inspect observation_status.
        observation_status:
          type: string
          enum: [observed_pq, observed_classical, undetermined]
        port: { type: integer, enum: [443] }
        limitations: { type: string }
        endpoint_summary:
          type: object
          nullable: true
          description: One handshake per public IP address (IPv4 first, up to 6). mixed=true means some addresses negotiate post-quantum key exchange and others do not.
          properties:
            total: { type: integer }
            pq: { type: integer }
            classical: { type: integer }
            failed: { type: integer }
            undetermined: { type: integer }
            mixed: { type: boolean }
        certificate_key: { type: string, example: ECDSA-256 }
        certificate_valid: { type: boolean }
        findings_in_full_report: { type: integer }
        scan_url: { type: string, format: uri }
        full_report_price:
          type: object
          properties:
            amount: { type: string, example: "49.00" }
            currency: { type: string, example: USD }
    Order:
      type: object
      properties:
        order_id: { type: string }
        approve_url: { type: string, format: uri }
        status_url: { type: string, format: uri }
        amount: { type: string, example: "49.00" }
        currency: { type: string, example: USD }
    OrderStatus:
      type: object
      properties:
        order_id: { type: string }
        status: { type: string, enum: [CREATED, PENDING, COMPLETED, FAILED] }
        amount: { type: string }
        currency: { type: string }
        report_url: { type: string, format: uri, description: Present when status is COMPLETED. }
    KeySizeAssessment:
      type: object
      properties:
        key_size_bits: { type: integer }
        algorithm: { type: string, example: RSA }
        classical_security: { type: string, enum: [weak, acceptable] }
        quantum_vulnerable: { type: boolean }
        quantum_note: { type: string }
        published_estimate: { type: string }
        recommended_action: { type: string }
        scan_your_domain: { type: object }
        full_report: { type: object }
    SignedReceiptResponse:
      type: object
      properties:
        receipt: { type: object, description: Structured v1 TLS receipt claims (policy qa-pqc-transport 1.0). }
        signed_receipt_jws: { type: string, description: RFC 7515 compact Ed25519 JWS (typ qa-tls-receipt+jwt). }
        verify:
          type: object
          properties:
            jwks_uri: { type: string, format: uri }
            receipt_url: { type: string, format: uri }
            policy_uri: { type: string, format: uri }
            cli: { type: string }
    AgentAffiliateRequest:
      type: object
      required: [name, contact_email, payout_method, consent_terms]
      properties:
        name: { type: string, minLength: 2, maxLength: 120, example: PQSecurityBot }
        contact_email: { type: string, format: email, example: ops@example.com }
        payout_method: { type: string, enum: [usdc, paypal] }
        payout_destination: { type: string, description: 0x EVM address for USDC on Base/Arbitrum, or PayPal email. }
        channel: { type: string, description: Optional description of how this agent recommends Quantum Aether. }
        website: { type: string, format: uri }
        consent_terms: { type: boolean, enum: [true] }
    AgentAffiliateRegistration:
      type: object
      properties:
        status: { type: string, enum: [active] }
        existing: { type: boolean }
        code: { type: string }
        referral_url: { type: string, format: uri }
        monitoring_referral_url: { type: string, format: uri }
        audit_referral_url: { type: string, format: uri }
        payout_schedule: { type: string, enum: [monthly_manual_by_owner] }
        commission: { type: object }
        rules: { type: array, items: { type: string } }
    Error:
      type: object
      properties:
        error:
          type: string
          enum: [invalid_domain, private_address, dns_failure, connect_failure, tls_failure, invalid_key_size]
        message: { type: string }
