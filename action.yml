name: 'Quantum Aether Post-Quantum TLS Check & Badge'
description: 'Free post-quantum TLS check for CI, with an optional live badge for your README.'
author: 'Quantum Aether'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  domain:
    description: 'Public domain name to check on port 443 (e.g. example.com)'
    required: true
  require-post-quantum:
    description: 'Fail the workflow if the server does not negotiate hybrid post-quantum key exchange (X25519MLKEM768)'
    required: false
    default: 'false'
  update-readme:
    description: 'Automatically insert or refresh the Quantum Aether dynamic badge in README.md'
    required: false
    default: 'false'
  write-report:
    description: 'Write the raw scan summary to qa_report.json'
    required: false
    default: 'false'
  min-grade:
    description: 'Optional minimum grade policy: A, B, C or F'
    required: false
    default: ''
  base-url:
    description: 'Scanner base URL'
    required: false
    default: 'https://ather-quantum.com'

outputs:
  grade:
    description: 'Observed Quantum Aether TLS grade (A, B, C, F)'
    value: ${{ steps.scan.outputs.grade }}
  pq:
    description: 'true, false or undetermined for hybrid post-quantum key exchange'
    value: ${{ steps.scan.outputs.post-quantum }}
  group:
    description: 'Negotiated TLS key-exchange group'
    value: ${{ steps.scan.outputs.key-exchange }}
  scan-url:
    description: 'Link to the scan details'
    value: ${{ steps.scan.outputs.scan-url }}
  badge-url:
    description: 'Dynamic SVG badge URL for the domain'
    value: ${{ steps.scan.outputs.badge-url }}

runs:
  using: 'composite'
  steps:
    - name: Run free Quantum Aether PQC TLS check
      id: scan
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_REQUIRE_PQ: ${{ inputs.require-post-quantum }}
        INPUT_UPDATE_README: ${{ inputs.update-readme }}
        INPUT_WRITE_REPORT: ${{ inputs.write-report }}
        INPUT_MIN_GRADE: ${{ inputs.min-grade }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
      run: python3 "$GITHUB_ACTION_PATH/github-action/scan.py"
