name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.lock
      - run: python -B -m unittest discover -s tests -t .
      - name: Shell and JavaScript syntax
        run: |
          for file in deploy/*.sh; do bash -n "$file"; done
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find static cli wordpress-plugin -name '*.js' -print0)
