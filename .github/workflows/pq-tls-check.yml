name: Post-Quantum TLS Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pq-tls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify hybrid post-quantum TLS (X25519MLKEM768) & refresh badge
        uses: moncef00327-cloud/quantum-aether@main
        with:
          domain: ather-quantum.com
          require-post-quantum: true
          update-readme: true
      - name: Persist badge update
        run: |
          if git diff --quiet -- README.md; then
            echo "README badge is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: refresh post-quantum TLS badge"
          git push
