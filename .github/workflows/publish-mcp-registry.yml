name: Publish to MCP Registry

# Manual: publishes mcp/server.json to registry.modelcontextprotocol.io (GitHub OIDC, no stored secret).
# server.json "version" must be new; the PyPI package it names must already exist with the mcp-name tag in its README.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: mcp
        run: ../mcp-publisher publish
