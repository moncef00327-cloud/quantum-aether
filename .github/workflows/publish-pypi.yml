name: Publish MCP server to PyPI

  on:
    push:
      tags: ["mcp-v*"]
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: mcp
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - name: Tag must match package version
          if: startsWith(github.ref, 'refs/tags/mcp-v')
          run: |
            version=$(python -c "import tomllib;
  print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            test "mcp-v$version" = "${GITHUB_REF_NAME}" || { echo "tag
  ${GITHUB_REF_NAME} != mcp-v$version"; exit 1; }
        - run: python -m pip install --upgrade build twine
        - run: python -m build
        - run: python -m twine check dist/*
        - uses: actions/upload-artifact@v4
          with:
            name: dist
            path: mcp/dist/

    publish:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: pypi
        url: https://pypi.org/p/quantum-aether-mcp
      permissions:
        id-token: write
      steps:
        - uses: actions/download-artifact@v4
          with:
            name: dist
            path: dist/
        - uses: pypa/gh-action-pypi-publish@release/v1
