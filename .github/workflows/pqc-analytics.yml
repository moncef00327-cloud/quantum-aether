name: Refresh PQC analytics feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pqc-analytics-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and classify official updates
        run: python generate_pqc_news.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- analytics/news_feed.json; then
            echo "No analytics feed changes."
            exit 0
          fi
          git config user.name "Quantum Aether Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analytics/news_feed.json
          git commit -m "chore: refresh PQC analytics feed [skip ci]"
          git push
