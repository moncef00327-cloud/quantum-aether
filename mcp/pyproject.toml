[project]
name = "quantum-aether-mcp"
version = "1.1.0"
description = "MCP server for Quantum Aether — check post-quantum TLS readiness from any AI assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "post-quantum", "tls", "mlkem", "x25519mlkem768", "security", "ai-tools"]
# mcp 2.x renamed FastMCP to MCPServer; server.py uses the 1.x API.
# mcp < 1.22 fails to import with current pydantic (eval_type_backport was removed), so require 1.22+.
dependencies = ["mcp>=1.22.0,<2"]

[project.scripts]
quantum-aether-mcp = "quantum_aether_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
