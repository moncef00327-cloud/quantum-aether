<section class="qa-agent-search" data-qa-agent-bar{% if qa_agent_mount %} data-qa-mount="{{ qa_agent_mount }}"{% endif %} data-lang="{{ lang }}" data-endpoint="{{ url_for('site.a2a_endpoint') }}" data-contact="mailto:{{ contact_email }}" role="search" aria-label="{{ 'وكيل الاستفسار والبحث A2A' if lang == 'ar' else ('A2A-Frage- und Suchassistent' if lang == 'de' else 'A2A Inquiry & Search Agent') }}">
  <form class="qa-agent-form" data-qa-agent-form novalidate>
    <span class="qa-agent-badge" aria-hidden="true"><span class="qa-agent-dot"></span>A2A</span>
    <label class="qa-sr-only" for="qa-agent-input">{{ 'اسأل وكيل Quantum Aether أو ابحث عن نطاق أو سعر أو إعدادات' if lang == 'ar' else ('Fragen Sie den Quantum-Aether-Assistenten oder suchen Sie nach Domain, Preisen oder Konfiguration' if lang == 'de' else 'Ask the Quantum Aether A2A agent or search a domain, pricing, or config') }}</label>
    <div class="qa-agent-field">
      <svg class="qa-agent-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="qa-agent-input" class="qa-agent-input" type="search" maxlength="300" autocomplete="off"
             placeholder="{{ 'اسأل وكيل A2A أو ابحث: نطاق (cloudflare.com)، أسعار، MSP Pilot، إعدادات Nginx، BSI/NIS2...' if lang == 'ar' else ('A2A-Assistent fragen oder suchen: Domain (cloudflare.com), Preise, MSP Pilot, nginx-Config, BSI/NIS2...' if lang == 'de' else 'Ask A2A agent or search: domain (cloudflare.com), pricing, MSP Pilot, nginx config, BSI/NIS2...') }}">
      <kbd class="qa-agent-kbd" aria-hidden="true">/</kbd>
    </div>
    <button type="submit" class="qa-agent-submit" data-qa-submit>{{ 'اسأل' if lang == 'ar' else ('Fragen' if lang == 'de' else 'Ask') }}</button>
  </form>
  <div class="qa-agent-chips" role="group" aria-label="{{ 'أسئلة سريعة' if lang == 'ar' else ('Schnellfragen' if lang == 'de' else 'Quick questions') }}">
    {% if lang == 'ar' %}
    <button type="button" class="qa-agent-chip" data-qa-prompt="هل cloudflare.com جاهز لما بعد الكم؟">فحص cloudflare.com</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="ما هو عرض MSP Pilot 290 €؟">عرض MSP Pilot (290 €)</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="إعدادات nginx لتفعيل X25519MLKEM768">إعدادات Nginx</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="ما هي مواعيد BSI وNIS2 وDORA؟">مواعيد BSI / NIS2</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="ما هي الأسعار والباقات؟">الأسعار والباقات</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="كيف أربط MCP في Cursor أو Claude؟">ربط MCP / A2A</button>
    {% elif lang == 'de' %}
    <button type="button" class="qa-agent-chip" data-qa-prompt="Ist cloudflare.com Post-Quantum-bereit?">cloudflare.com prüfen</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="Was beinhaltet der MSP Pilot für 290 EUR?">MSP Pilot (290 €)</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="nginx Konfiguration für X25519MLKEM768">Nginx-Konfiguration</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="Welche Fristen gelten für BSI, NIS2 und DORA?">BSI / NIS2 Fristen</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="Welche Preise und Pakete gibt es?">Preise &amp; Pakete</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="Wie verbinde ich MCP mit Cursor oder Claude?">MCP / A2A verbinden</button>
    {% else %}
    <button type="button" class="qa-agent-chip" data-qa-prompt="Is cloudflare.com post-quantum ready?">Check cloudflare.com</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="Tell me about the 290 EUR MSP Pilot">MSP Pilot (290 €)</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="How to configure nginx for X25519MLKEM768?">Nginx PQC config</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="What are the BSI, NIS2, and NIST PQC deadlines?">BSI / NIS2 deadlines</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="What are the plans and pricing?">Pricing &amp; plans</button>
    <button type="button" class="qa-agent-chip" data-qa-prompt="How do I connect MCP in Cursor or Claude?">Connect MCP / A2A</button>
    {% endif %}
  </div>
  <div class="qa-agent-panel" data-qa-panel hidden aria-live="polite">
    <div class="qa-agent-panel-head">
      <span class="qa-agent-panel-title" data-qa-panel-title><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20 5.5v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10v-6z"></path><path d="m9 12 2 2 4-4"></path></svg>{{ 'رد وكيل Quantum Aether (A2A)' if lang == 'ar' else ('Antwort · Quantum Aether A2A-Assistent' if lang == 'de' else 'Quantum Aether A2A Agent') }}</span>
      <button type="button" class="qa-agent-close" data-qa-close aria-label="{{ 'إغلاق' if lang == 'ar' else ('Schließen' if lang == 'de' else 'Close') }}">×</button>
    </div>
    <p class="qa-agent-answer" data-qa-answer></p>
    <ul class="qa-agent-points" data-qa-points hidden></ul>
    <div class="qa-agent-code-wrap" data-qa-code-wrap hidden>
      <div class="qa-agent-code-head">
        <span data-qa-code-label>Config</span>
        <button type="button" class="qa-agent-copy" data-qa-copy>{{ 'نسخ' if lang == 'ar' else ('Kopieren' if lang == 'de' else 'Copy') }}</button>
      </div>
      <pre dir="ltr"><code data-qa-code></code></pre>
    </div>
    <div class="qa-agent-actions" data-qa-actions hidden></div>
    <div class="qa-agent-meta" data-qa-meta></div>
  </div>
</section>
