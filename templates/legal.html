{% extends "base.html" %}
{% block title %}{{ page.title }} · Quantum Aether{% endblock %}
{% block description %}{{ page.title }} · ather-quatum.cloud{% endblock %}
{% block alternates %}
  <link rel="canonical" href="{{ metadata_url(lang) }}">
  <link rel="alternate" hreflang="de" href="{{ metadata_url('de') }}">
  <link rel="alternate" hreflang="en" href="{{ metadata_url('en') }}">
  <link rel="alternate" hreflang="x-default" href="{{ metadata_url('de') }}">
{% endblock %}
{% block content %}
<article class="card prose" lang="{{ lang }}">
  <p class="small"><a href="{{ request.path }}?lang=de">Deutsch</a> · <a href="{{ request.path }}?lang=en">English</a></p>
  <h1>{{ page.title }}</h1>
  {{ page.body | safe }}
</article>
{% endblock %}
